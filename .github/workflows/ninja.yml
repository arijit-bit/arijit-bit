name: Generate Ninja Animation

on:
  schedule:
    - cron: "0 3 * * 1"      # weekly safety refresh (Mon 03:00 UTC)
  workflow_dispatch:          # run manually from the Actions tab
  push:
    branches: [main]
    paths:
      - ".github/scripts/ninja.mjs"
      - ".github/workflows/ninja.yml"

# Only one run at a time; never cancel a run that is mid-commit.
concurrency:
  group: ninja-animation
  cancel-in-progress: false

permissions:
  contents: write             # needed to commit the generated SVGs

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies: the generator is a single self-contained script.
      - name: Generate ninja animation
        run: node .github/scripts/ninja.mjs assets

      - name: Commit only if the output changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ninja-dark.svg assets/ninja-light.svg
          if git diff --cached --quiet; then
            echo "Animation unchanged - nothing to commit."
          else
            git commit -m "chore: update ninja animation [skip ci]"
            git push
          fi
